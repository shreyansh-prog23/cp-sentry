name: Update Contests

on:
  schedule:
    - cron: '0 1 * * 1'  # Every Monday 1 AM UTC (6:30 AM IST)
  workflow_dispatch:       # Manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Run scraper
        env:
          CLIST_API_KEY: ${{ secrets.CLIST_API_KEY }}
        run: python scraper.py

      - name: Commit updated contests
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/contests.json
          git diff --staged --quiet || git commit -m "chore: weekly contest refresh"
          git push
